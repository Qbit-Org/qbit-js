name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # fixtures:check runs Python fetched from qbit Core; keep the token out of .git/config.
          persist-credentials: false

      # No `version:` input: the action installs the pnpm pinned by
      # package.json `packageManager`, so CI and local corepack cannot drift.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check pnpm matches packageManager
        run: |
          expected="$(node -p "require('./package.json').packageManager.split('+')[0].slice('pnpm@'.length)")"
          actual="$(pnpm --version)"
          echo "packageManager pnpm $expected, running pnpm $actual"
          test "$actual" = "$expected"

      # engine-strict turns pnpm's "Unsupported engine" warning into a failure,
      # so CI's Node must stay inside the root engines.node range and every
      # non-optional locked dependency's engines.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=true

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Check npm package contents
        run: pnpm pack:check

      # Type-checks the packed declarations as a Node-only (no DOM lib) and a
      # browser (no @types/node) consumer, and loads the CJS and ESM builds
      # side by side to check the error-class brands.
      - name: Packed-consumer types and dual-build check
        run: pnpm consumer:check

      - name: Fresh-consumer install smoke
        run: pnpm smoke:consumer

      # Regenerates p2mr-sighash.json and p2mr-psbt.json (the generated fixtures
      # in packages/protocol/fixtures) from a fresh qbit Core v1.0.0 clone and
      # fails unless both match the committed files byte for byte.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Check Core-derived fixtures reproduce from qbit Core
        run: pnpm fixtures:check
