packages:
  - 'packages/*'
  # Private, never published: runnable examples that test against the built packages.
  - 'examples'

# pnpm 11 reads only camelCase settings from this file; kebab-case keys are ignored.
preferWorkspacePackages: true
linkWorkspacePackages: true
sharedWorkspaceLockfile: true

# Dependency lifecycle scripts are blocked unless approved here (strictDepBuilds
# fails the install otherwise). esbuild's postinstall verifies its platform binary.
allowBuilds:
  esbuild: true

# Do not resolve package versions published less than 1 day (in minutes) ago.
minimumReleaseAge: 1440
